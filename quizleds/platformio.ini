; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Everything is pinned. An unpinned "espressif32" resolves to whichever platform of that name
; is installed, which may be a fork on Arduino core 3.x (ESP-IDF 5). That breaks the build:
; core 3.x no longer ships esp_websocket_client, and NeoPixelBus before 2.8 does not support it.
[env:main]
platform = platformio/espressif32@6.13.0
board = esp32dev
framework = arduino
build_flags = -D_GLIBCXX_USE_C99 -std=c++11 -Isrc -Isrc/string -Wno-deprecated-declarations
monitor_speed = 115200
build_type = release
monitor_filters = colorize
lib_deps = 
	makuna/NeoPixelBus@2.8.4
build_src_filter = +<*.cpp> +<string/>

; The desk trees: ESP32-C3 SuperMini with an 8 LED ring. Shares the top of src/ (net.cpp, the
; WiFi and websocket transport, and credentials.h) with the string; everything else is in src/tree/.
[env:tree]
platform = platformio/espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
; Serial over the C3's native USB port. NET_TX_POWER: see net.cpp.
build_flags = -std=c++11 -Isrc -Wno-deprecated-declarations
	-DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
	-DNET_TX_POWER=WIFI_POWER_8_5dBm
build_src_filter = +<*.cpp> +<tree/>
monitor_speed = 115200
build_type = release
monitor_filters = colorize
; Never fall back to the Bluetooth port when no board is found
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
lib_deps =
	makuna/NeoPixelBus@2.8.4
