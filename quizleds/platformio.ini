; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Everything is pinned. An unpinned "espressif32" resolves to whichever platform of that name
; is installed, which may be a fork on Arduino core 3.x (ESP-IDF 5). That breaks the build:
; core 3.x no longer ships esp_websocket_client, and NeoPixelBus before 2.8 does not support it.
[env:main]
platform = platformio/espressif32@6.13.0
board = esp32dev
framework = arduino
build_flags = -D_GLIBCXX_USE_C99 -std=c++11 -Isrc -Wno-deprecated-declarations
monitor_speed = 115200
build_type = release
monitor_filters = colorize
lib_deps = 
	makuna/NeoPixelBus@2.8.4
