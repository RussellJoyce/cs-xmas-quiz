; The desk trees: an 8 LED ring on a small ESP32 board. Build from this folder, for example
;   pio run -e tree_c6 -t upload
;
; The source is in ../src: the trees use the top of it (net.cpp, the WiFi and websocket
; transport, and credentials.h), which they share with the string, and ../src/tree/.
;
; Why this is a project of its own: the trees are built on Arduino core 3 (pioarduino), the
; only Arduino core that supports the ESP32-C6, and the string is built on core 2. PlatformIO
; keeps one copy of each package per packages folder, and both cores are a package called
; framework-arduinoespressif32, so from one project each build replaced the other's and the
; first build after switching failed. packages_dir below gives the trees their own.
;
; pioarduino 55.03.311 is Arduino core 3.3.11; later releases need a newer PlatformIO Core
; than PyPI has at the time of writing.

[platformio]
src_dir = ../src
packages_dir = ~/.platformio/packages-core3

[tree]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
; Serial over the native USB port, on both the C3 and the C6
build_flags = -I../src -Wno-deprecated-declarations
	-DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*.cpp> +<tree/>
; Two 1.9 MB firmware slots instead of 1.25 MB, for room to grow with OTA updates. The trees
; use no filesystem, so the smaller SPIFFS costs nothing. Only a USB flash can change this.
board_build.partitions = min_spiffs.csv
; Copies each build to ../../nodeserver/firmware/ for over-the-air updates
extra_scripts = post:copy_firmware.py
; lib/ holds esp_websocket_client, which Arduino core 3 no longer includes
lib_deps =
	makuna/NeoPixelBus@2.8.4
monitor_speed = 115200
build_type = release
monitor_filters = colorize
; Never fall back to the Bluetooth port when no board is found. A USB audio device can also
; appear as usbmodem, so pass --upload-port if more than one is plugged in.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

; ESP32-C3 SuperMini, ring data on GPIO10. NET_TX_POWER: see net.cpp.
[env:tree]
extends = tree
board = esp32-c3-devkitm-1
build_flags = ${tree.build_flags}
	-DTREE_LED_PIN=10
	-DNET_TX_POWER=WIFI_POWER_8_5dBm

; Waveshare ESP32-C6-Zero, ring data on GPIO2. GPIO8 is the onboard RGB LED, and 4, 5, 8, 9
; and 15 are strapping pins. The board definition says 4 MB of flash; the C6FH8 on the Zero
; has 8, so half is unused.
[env:tree_c6]
extends = tree
board = esp32-c6-devkitm-1
build_flags = ${tree.build_flags}
	-DTREE_LED_PIN=2
