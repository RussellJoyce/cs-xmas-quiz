<!DOCTYPE html>
<html>
<head>
<title>Quiz Multi-Client Test</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 10px; }

/* Toolbar */
#toolbar { background: #16213e; padding: 12px; border-radius: 8px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
#toolbar label { font-size: 13px; color: #aaa; }
#toolbar input[type="text"], #toolbar input[type="number"], #toolbar select {
    background: #0f3460; border: 1px solid #444; color: #eee; padding: 5px 8px; border-radius: 4px; font-size: 13px;
}
#toolbar input[type="text"] { width: 140px; }
#toolbar input[type="number"] { width: 70px; }
#toolbar select { width: 60px; }
#toolbar button {
    padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600;
}
.btn-connect { background: #27ae60; color: #fff; }
.btn-connect:hover { background: #2ecc71; }
.btn-disconnect { background: #c0392b; color: #fff; }
.btn-disconnect:hover { background: #e74c3c; }
#toolbar .check-label { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #ccc; cursor: pointer; }

/* Pattern bar */
#pattern-bar { background: #16213e; padding: 12px; border-radius: 8px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
#pattern-bar label { font-size: 13px; color: #aaa; }
#pattern-bar select { background: #0f3460; border: 1px solid #444; color: #eee; padding: 5px 8px; border-radius: 4px; font-size: 13px; min-width: 280px; }
#pattern-bar button { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; }
#pattern-bar button:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-fire { background: #8e44ad; color: #fff; }
.btn-fire:hover:not(:disabled) { background: #9b59b6; }
.btn-stop { background: #c0392b; color: #fff; }
.btn-stop:hover:not(:disabled) { background: #e74c3c; }
#pattern-status { font-size: 12px; color: #888; font-family: monospace; }
#pattern-status.warn { color: #f39c12; }
#pattern-hint { font-size: 12px; color: #666; margin-left: auto; }
#pattern-hint code { color: #8e7cc3; font-family: monospace; }

.msg-pattern { color: #bb8fce; }

/* Grid */
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-bottom: 12px; }

/* Client cell */
.cell { background: #16213e; border-radius: 8px; padding: 10px; border: 1px solid #333; display: flex; flex-direction: column; gap: 6px; }
.cell-header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot-red { background: #e74c3c; }
.dot-yellow { background: #f39c12; }
.dot-green { background: #2ecc71; }
.cell-status { font-size: 11px; color: #888; line-height: 1.4; }
.cell-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
.cell-buttons button {
    padding: 4px 8px; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; font-weight: 600;
}
.cell-buttons button:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sm-green { background: #27ae60; color: #fff; }
.btn-sm-red { background: #c0392b; color: #fff; }
.btn-sm-blue { background: #2980b9; color: #fff; }
.btn-sm-orange { background: #e67e22; color: #fff; }
.btn-sm-purple { background: #8e44ad; color: #fff; }
.btn-sm-gray { background: #555; color: #fff; }
.btn-sm-teal { background: #16a085; color: #fff; }

/* Team picker */
.team-row { display: flex; flex-wrap: wrap; gap: 2px; }
.team-row button { padding: 3px 6px; font-size: 10px; background: #0f3460; color: #aaa; border: 1px solid #444; border-radius: 3px; cursor: pointer; }
.team-row button:hover { background: #1a5276; color: #fff; }

/* Input row */
.answer-inputs { display: flex; flex-direction: column; gap: 6px; }
.input-row { display: flex; gap: 4px; }
.input-row input {
    flex: 1; background: #0f3460; border: 1px solid #444; color: #eee; padding: 4px 6px; border-radius: 3px; font-size: 11px;
}
.input-row button { flex-shrink: 0; }

/* Message log */
.msg-log { height: 100px; overflow-y: auto; background: #0a0a1a; border-radius: 4px; padding: 4px 6px; font-family: monospace; font-size: 10px; line-height: 1.4; }
.msg-sent { color: #888; }
.msg-recv { color: #2ecc71; }
.msg-err { color: #e74c3c; }
.msg-info { color: #f39c12; }

/* Global log */
#global-log { background: #0a0a1a; border-radius: 8px; padding: 10px; height: 180px; overflow-y: auto; font-family: monospace; font-size: 11px; line-height: 1.5; }
#global-log-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
</style>
</head>
<body>

<div id="toolbar">
    <label>Host: <input type="text" id="cfg-host"></label>
    <label>Port: <input type="number" id="cfg-port" value="8090"></label>
    <label>Clients:
        <select id="cfg-count"></select>
    </label>
    <button class="btn-connect" onclick="connectAll()">Connect All</button>
    <button class="btn-disconnect" onclick="disconnectAll()">Disconnect All</button>
    <label class="check-label"><input type="checkbox" id="cfg-autopick" checked> Auto-pick teams</label>
    <label class="check-label"><input type="checkbox" id="cfg-filterpings" checked> Filter Pings</label>
    <label class="check-label"><input type="checkbox" id="cfg-showanswers"> Show Answers</label>
</div>

<div id="pattern-bar">
    <label>Test pattern:
        <select id="cfg-pattern"></select>
    </label>
    <button class="btn-fire" id="btn-fire" onclick="firePattern()">Fire</button>
    <button class="btn-stop" id="btn-stop" onclick="stopPattern()" disabled>Stop</button>
    <span id="pattern-status"></span>
    <span id="pattern-hint">edit <code>test-patterns.js</code> to add your own, then reload</span>
</div>

<div id="grid"></div>

<div id="global-log-title">Global Log</div>
<div id="global-log"></div>

<script src="test-patterns.js"></script>
<script>
// Init config
// Served by the quiz server, so this is the name the certificate was issued for.
document.getElementById('cfg-host').value = location.hostname || 'localhost';
var countSel = document.getElementById('cfg-count');
for (var i = 1; i <= 16; i++) {
    var opt = document.createElement('option');
    opt.value = i; opt.textContent = i;
    if (i === 4) opt.selected = true;
    countSel.appendChild(opt);
}

var clients = [null]; // 1-indexed: clients[N] = VirtualClient with index N
var globalLogEl = document.getElementById('global-log');

function logLine(prefix, cls, text) {
    var d = document.createElement('div');
    d.className = cls;
    d.textContent = prefix + ' ' + text;
    globalLogEl.appendChild(d);
    if (globalLogEl.children.length > 200) globalLogEl.removeChild(globalLogEl.firstChild);
    globalLogEl.scrollTop = globalLogEl.scrollHeight;
}

function globalLog(idx, cls, text) {
    logLine('[Client ' + idx + ']', cls, text);
}

function patternLog(cls, text) {
    logLine('[pattern]', cls, text);
}

// ---------------------------------------------------------------- the wiki corpus
// A wikirace client cannot invent a move: the server refuses any article that is not
// genuinely linked from where the team is standing. So to put a team a known distance from
// the target, a pattern walks the puzzle's ideal route, which puzzles.json records as
// `routeIds`. That route is a real shortest path, so stopping k steps from its end leaves
// the team exactly k links short — which is the number the quiz software ranks the
// near-miss highlights on.
//
// Both files come off the quiz server, so the wiki actions only work when this page is
// served from it. Opened off the disk, they report that rather than hanging.

var wikiPuzzles = null;
var wikiShard = 1000;
var wikiArticles = {};   // article json by id, because a stray walk re-reads pages constantly

function loadWikiCorpus() {
    fetch('/wiki/meta.json')
        .then(function(r) { return r.json(); })
        .then(function(meta) { wikiShard = meta.shard || wikiShard; })
        .catch(function() { /* reported by the puzzles fetch below, no need to say it twice */ });

    fetch('/wiki/puzzles.json')
        .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function(rows) {
            wikiPuzzles = rows;
            patternLog('msg-info', 'wiki: ' + rows.length + ' puzzles loaded, wiki actions are ready');
        })
        .catch(function(e) {
            patternLog('msg-err', 'wiki: cannot read /wiki/puzzles.json (' + e.message +
                       '), so the wiki actions will not run. Open this page from the quiz ' +
                       'server rather than off the disk.');
        });
}

// One article's outward links, as the ids the server will accept in a 'wl'.
function wikiArticle(id) {
    if (wikiArticles[id]) return Promise.resolve(wikiArticles[id]);
    return fetch('/wiki/a/' + Math.floor(id / wikiShard) + '/' + id + '.json')
        .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        })
        .then(function(a) { wikiArticles[id] = a; return a; });
}

function wikiOutlinks(article) {
    var ids = [], seen = {}, re = /data-s="([0-9]+)"/g, m;
    while ((m = re.exec(article.h)) !== null) {
        var id = parseInt(m[1], 10);
        if (!seen[id]) { seen[id] = true; ids.push(id); }
    }
    return ids;
}

// VirtualClient class
function VirtualClient(index) {
    this.index = index;
    this.ws = null;
    this.team = null;
    this.view = 'pickteam';
    this.buzzerOn = false;
    this.hlLabels = 'truefalse'; // 'truefalse' or 'higherlower'
    this.optionCount = 4;        // Multiple choice tiles, as last set by 'mo'
    this.pingInterval = null;

    // Wikirace. `race` is set by 'wr' and holds the race the host has started; `wikiAt` is
    // the article the server last confirmed us on, which is the only position that counts
    // — a move is judged against it, not against whatever we think we clicked.
    this.race = null;
    this.wikiAt = -1;
    this.wikiHops = 0;
    this.wikiDone = false;
    this.wikiWalk = null;        // a multi-step walk in progress, stepped on by each 'wg'

    // Create DOM
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.id = 'cell-' + index;

    cell.innerHTML =
        '<div class="cell-header"><span>Client ' + index + '</span><span class="dot dot-red" id="dot-' + index + '"></span></div>' +
        '<div class="cell-status" id="status-' + index + '">Disconnected</div>' +
        '<div class="cell-buttons">' +
            '<button class="btn-sm-green" id="conn-' + index + '" onclick="clients[' + index + '].toggleConnect()">Connect</button>' +
            '<button class="btn-sm-orange" id="buzz-' + index + '" onclick="clients[' + index + '].buzz()" disabled>Buzz</button>' +
            '<button class="btn-sm-blue" id="btn-a-' + index + '" onclick="clients[' + index + '].sendHL(\'hi\')" disabled>TRUE</button>' +
            '<button class="btn-sm-blue" id="btn-b-' + index + '" onclick="clients[' + index + '].sendHL(\'lo\')" disabled>FALSE</button>' +
        '</div>' +
        '<div class="team-row" id="teams-' + index + '"></div>' +
        //Hidden by default: a grid of fourteen clients is mostly these boxes, and the
        //patterns drive every one of these answers without them. They are still here for
        //when you want to type something by hand.
        '<div class="answer-inputs" id="answers-' + index + '">' +
            '<div class="input-row">' +
                '<input type="text" id="txt-' + index + '" placeholder="Text answer...">' +
                '<button class="btn-sm-purple" onclick="clients[' + index + '].sendText()" disabled id="txtsend-' + index + '">Send</button>' +
            '</div>' +
            '<div class="input-row">' +
                '<input type="text" id="geo-' + index + '" placeholder="x,y (0-100)">' +
                '<button class="btn-sm-teal" onclick="clients[' + index + '].sendGeo()" disabled id="geosend-' + index + '">Send</button>' +
                '<button class="btn-sm-gray" onclick="clients[' + index + '].sendRandomGeo()" disabled id="georand-' + index + '">Rnd</button>' +
            '</div>' +
            '<div class="input-row">' +
                '<input type="text" id="choice-' + index + '" placeholder="choice (1-6)">' +
                '<button class="btn-sm-teal" onclick="clients[' + index + '].sendChoice()" disabled id="choicesend-' + index + '">Send</button>' +
                '<button class="btn-sm-gray" onclick="clients[' + index + '].sendRandomChoice()" disabled id="choicerand-' + index + '">Rnd</button>' +
            '</div>' +
            '<div class="input-row">' +
                '<input type="text" id="wave-' + index + '" placeholder="wavelength (1-99)">' +
                '<button class="btn-sm-teal" onclick="clients[' + index + '].sendWave()" disabled id="wavesend-' + index + '">Send</button>' +
                '<button class="btn-sm-gray" onclick="clients[' + index + '].sendRandomWave()" disabled id="waverand-' + index + '">Rnd</button>' +
            '</div>' +
        '</div>' +
        '<div class="msg-log" id="log-' + index + '"></div>';

    document.getElementById('grid').appendChild(cell);

    // Build team buttons
    var teamRow = document.getElementById('teams-' + index);
    for (var t = 1; t <= 14; t++) {
        var btn = document.createElement('button');
        btn.textContent = t;
        btn.setAttribute('data-team', t);
        btn.setAttribute('data-idx', index);
        btn.onclick = function() { clients[parseInt(this.getAttribute('data-idx'))].pickTeam(this.getAttribute('data-team')); };
        teamRow.appendChild(btn);
    }
}

VirtualClient.prototype.log = function(cls, text) {
    var el = document.getElementById('log-' + this.index);
    var d = document.createElement('div');
    d.className = cls;
    d.textContent = text;
    el.appendChild(d);
    if (el.children.length > 20) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
    globalLog(this.index, cls, text);
};

VirtualClient.prototype.updateStatus = function() {
    var state = this.ws ? (this.ws.readyState === WebSocket.OPEN ? 'Connected' : 'Connecting...') : 'Disconnected';
    var parts = [state];
    if (this.team) parts.push('Team ' + this.team);
    parts.push('View: ' + this.view);
    parts.push('Buzzer: ' + (this.buzzerOn ? 'ON' : 'OFF'));
    if (this.race) {
        parts.push('Wiki: ' + (this.wikiDone ? 'arrived' : this.wikiHops + ' hops'));
    }
    document.getElementById('status-' + this.index).textContent = parts.join(' | ');

    // Dot color
    var dot = document.getElementById('dot-' + this.index);
    if (!this.ws || this.ws.readyState === WebSocket.CLOSED) {
        dot.className = 'dot dot-red';
    } else if (this.ws.readyState === WebSocket.CONNECTING) {
        dot.className = 'dot dot-yellow';
    } else {
        dot.className = 'dot dot-green';
    }

    // Enable/disable buttons
    var connected = this.ws && this.ws.readyState === WebSocket.OPEN;
    var hasTeam = this.team != null;
    document.getElementById('buzz-' + this.index).disabled = !(connected && hasTeam && this.buzzerOn);
    document.getElementById('btn-a-' + this.index).disabled = !(connected && hasTeam);
    document.getElementById('btn-b-' + this.index).disabled = !(connected && hasTeam);
    document.getElementById('txtsend-' + this.index).disabled = !(connected && hasTeam);
    document.getElementById('geosend-' + this.index).disabled = !(connected && hasTeam);
    document.getElementById('georand-' + this.index).disabled = !(connected && hasTeam);
    document.getElementById('choicesend-' + this.index).disabled = !(connected && hasTeam);
    document.getElementById('choicerand-' + this.index).disabled = !(connected && hasTeam);
    document.getElementById('wavesend-' + this.index).disabled = !(connected && hasTeam);
    document.getElementById('waverand-' + this.index).disabled = !(connected && hasTeam);

    // Team row visibility
    document.getElementById('teams-' + this.index).style.display = (connected && !hasTeam) ? 'flex' : 'none';

    // Connect button label
    var connBtn = document.getElementById('conn-' + this.index);
    if (connected || (this.ws && this.ws.readyState === WebSocket.CONNECTING)) {
        connBtn.textContent = 'Disconnect';
        connBtn.className = 'btn-sm-red';
    } else {
        connBtn.textContent = 'Connect';
        connBtn.className = 'btn-sm-green';
    }
};

VirtualClient.prototype.toggleConnect = function() {
    if (this.ws && (this.ws.readyState === WebSocket.OPEN || this.ws.readyState === WebSocket.CONNECTING)) {
        this.disconnect();
    } else {
        this.connect();
    }
};

VirtualClient.prototype.connect = function() {
    if (this.ws) return;
    //wss and nothing else: the server has no plain client port, so these clients run over
    //exactly the transport the phones do.
    var proto = 'wss://';
    var host = document.getElementById('cfg-host').value;
    var port = document.getElementById('cfg-port').value;
    var url = proto + host + ':' + port + '/?vcid=test' + this.index;

    this.log('msg-info', 'Connecting to ' + url);
    this.updateStatus();

    // Auto-pick is decided per connection and consumed by the first 'vipickteam' we get
    // back. Set it before the socket exists so it cannot be missed by an early message.
    this.autopickPending = document.getElementById('cfg-autopick').checked;

    var self = this;
    try {
        this.ws = new WebSocket(url);
    } catch(e) {
        this.log('msg-err', 'Error: ' + e.message);
        this.ws = null;
        this.updateStatus();
        return;
    }

    this.ws.onopen = function() {
        self.log('msg-info', 'Connected');
        self.updateStatus();

        // Start ping
        self.pingInterval = setInterval(function() {
            if (self.ws && self.ws.readyState === WebSocket.OPEN) {
                self.ws.send('pi');
            }
        }, 5000);

        // Ask the server which team we are
        self.send('re');
    };

    this.ws.onmessage = function(event) {
        var msg = event.data;
        // filter pings unless we fired from a pattern
        if (msg.slice(0, 2) !== 'pb' || !document.getElementById('cfg-filterpings').checked) {
            self.log('msg-recv', '< ' + msg);
        }
        self.handleMessage(msg);
    };

    this.ws.onclose = function() {
        self.log('msg-info', 'Disconnected');
        clearInterval(self.pingInterval);
        self.pingInterval = null;
        self.ws = null;
        self.team = null;
        self.view = 'pickteam';
        self.buzzerOn = false;
        self.updateStatus();
    };

    this.ws.onerror = function() {
        self.log('msg-err', 'WebSocket error');
    };
};

VirtualClient.prototype.disconnect = function() {
    if (this.ws) {
        this.ws.close();
    }
};

VirtualClient.prototype.send = function(msg) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
        this.ws.send(msg);
        this.log('msg-sent', '> ' + msg);
    }
};

VirtualClient.prototype.handleMessage = function(msg) {
    if (msg.length < 2) return;
    var cmd = msg.slice(0, 2);
    var payload = msg.slice(2);

    switch (cmd) {
        case 'ok':
            this.team = payload;
            this.buzzerOn = true;
            this.updateStatus();
            break;
        case 'px':
            this.log('msg-err', 'Team already taken');
            this.updateStatus();
            break;
        case 'on':
            this.buzzerOn = true;
            this.updateStatus();
            break;
        case 'of':
            this.buzzerOn = false;
            this.updateStatus();
            break;
        case 'vi':
            this.view = payload;
            if (payload === 'pickteam') {
                this.team = null;
                this.buzzerOn = false;
                // The server does not recognise us, so claim a team
                if (this.autopickPending) {
                    this.autopickPending = false;
                    var self = this;
                    var teamNum = this.index;
                    if (teamNum >= 1 && teamNum <= 14) {
                        setTimeout(function() { self.pickTeam(teamNum); }, 100);
                    }
                }
            }
            this.updateStatus();
            break;
        case 'im':
            // Geo image update - just log it
            break;
        case 'mo':
            // The multiple choice grid. Remembered so that a random choice picks an
            // option that exists.
            var count = parseInt(payload.split(',')[0], 10);
            if (count >= 2 && count <= 6) {
                this.optionCount = count;
            }
            break;
        case 'ms':
            break;
        case 'hh':
            document.getElementById('btn-a-' + this.index).style.outline = '2px solid #2ecc71';
            document.getElementById('btn-b-' + this.index).style.outline = 'none';
            break;
        case 'hl':
            document.getElementById('btn-b-' + this.index).style.outline = '2px solid #2ecc71';
            document.getElementById('btn-a-' + this.index).style.outline = 'none';
            break;
        case 'hn':
            document.getElementById('btn-a-' + this.index).style.outline = 'none';
            document.getElementById('btn-b-' + this.index).style.outline = 'none';
            break;
        case 'h1':
            this.hlLabels = 'higherlower';
            document.getElementById('btn-a-' + this.index).textContent = 'HIGHER';
            document.getElementById('btn-b-' + this.index).textContent = 'LOWER';
            break;
        case 'h2':
            this.hlLabels = 'truefalse';
            document.getElementById('btn-a-' + this.index).textContent = 'TRUE';
            document.getElementById('btn-b-' + this.index).textContent = 'FALSE';
            break;
        case 'pb':
            // Pong - no action needed
            break;

        case 'wr': {
            // "wr<start>,<target>,<startTitle>|<targetTitle>". Everyone starts on <start>.
            var race = payload.split(',');
            this.race = { start: parseInt(race[0], 10), target: parseInt(race[1], 10) };
            this.wikiAt = this.race.start;
            this.wikiHops = 0;
            this.wikiDone = false;
            this.wikiWalk = null;
            this.updateStatus();
            break;
        }
        case 'wg': {
            // "wg<articleId>,<hops>" — the server confirming where we now are. A walk takes
            // its next step from here rather than firing its moves back to back, because
            // each one is judged against the position the server thinks we hold.
            var at = payload.split(',');
            this.wikiAt = parseInt(at[0], 10);
            this.wikiHops = parseInt(at[1], 10);
            this.updateStatus();
            this.stepWalk();
            break;
        }
        case 'wf':
            this.wikiDone = true;
            this.wikiWalk = null;
            this.updateStatus();
            break;
        case 'wx':
            // A refused move. Whatever walk was running is now working from a position the
            // server disagrees with, so it stops rather than flailing at the same article.
            this.log('msg-err', 'wiki move refused');
            this.wikiWalk = null;
            break;
        case 'we':
            // The race is over and we are frozen where we stand.
            this.wikiWalk = null;
            this.updateStatus();
            break;
    }
};

// ---------------------------------------------------------------- wikirace actions

// The ideal route for the race in progress, as article ids.
VirtualClient.prototype.wikiRoute = function() {
    if (!this.race || !wikiPuzzles) return null;
    for (var i = 0; i < wikiPuzzles.length; i++) {
        var p = wikiPuzzles[i];
        if (p.start === this.race.start && p.target === this.race.target) {
            return p.routeIds || null;
        }
    }
    return null;
};

// Takes the next step of whatever walk is running, or stops if it has arrived where it
// was sent. Called on every 'wg', so a walk unrolls one confirmed move at a time.
VirtualClient.prototype.stepWalk = function() {
    var walk = this.wikiWalk;
    if (!walk || this.wikiDone) return;

    if (walk.mode === 'route') {
        var here = walk.route.indexOf(this.wikiAt);
        if (here < 0 || here >= walk.stopAt) { this.wikiWalk = null; return; }
        this.send('wl' + this.team + ',' + walk.route[here + 1]);
        return;
    }

    if (walk.mode === 'stray') {
        if (walk.left <= 0) { this.wikiWalk = null; return; }
        walk.left--;
        var self = this, from = this.wikiAt;
        //Anything but the route: the point of a stray is to end up somewhere the pattern
        //did not choose, so that it tests what the ranking does with an unknown distance.
        var route = this.wikiRoute() || [];
        wikiArticle(from)
            .then(function(article) {
                if (self.wikiWalk !== walk || self.wikiAt !== from) return;
                var links = wikiOutlinks(article).filter(function(id) {
                    return route.indexOf(id) < 0;
                });
                if (!links.length) {
                    self.log('msg-err', 'wiki: nothing to stray to from here');
                    self.wikiWalk = null;
                    return;
                }
                self.send('wl' + self.team + ',' + links[Math.floor(Math.random() * links.length)]);
            })
            .catch(function(e) {
                self.log('msg-err', 'wiki: cannot read article ' + from + ' (' + e.message + ')');
                self.wikiWalk = null;
            });
    }
};

// "short <n>": walk the ideal route and stop n links from the target, 0 being the target
// itself. Reports rather than half-doing it if the race cannot supply that position.
VirtualClient.prototype.walkShort = function(stopShort) {
    if (!this.race) return 'wiki: no race is running';
    if (this.wikiDone) return 'wiki: already arrived';
    var route = this.wikiRoute();
    if (!route) {
        return wikiPuzzles ? 'wiki: no puzzle in puzzles.json matches this race'
                           : 'wiki: puzzles.json is not loaded';
    }

    var hops = route.length - 1;
    if (stopShort > hops) {
        return 'wiki: this race is only ' + hops + ' hops, cannot stop ' + stopShort + ' short';
    }
    var here = route.indexOf(this.wikiAt);
    if (here < 0) return 'wiki: off the ideal route, so "short" cannot count from here';

    var stopAt = hops - stopShort;
    if (stopAt < here) return 'wiki: already closer than ' + stopShort + ' short';
    if (stopAt === here) return null;   //nothing to do, and not an error

    this.wikiWalk = { mode: 'route', route: route, stopAt: stopAt };
    this.stepWalk();
    return null;
};

VirtualClient.prototype.walkStray = function(count) {
    if (!this.race) return 'wiki: no race is running';
    if (this.wikiDone) return 'wiki: already arrived';
    if (count <= 0) return null;
    this.wikiWalk = { mode: 'stray', left: count };
    this.stepWalk();
    return null;
};

VirtualClient.prototype.pickTeam = function(teamNum) {
    this.send('pt' + teamNum);
};

VirtualClient.prototype.buzz = function() {
    if (this.team) {
        this.send('zz' + this.team);
    }
};

VirtualClient.prototype.sendHL = function(type) {
    if (this.team) {
        this.send(type + this.team);
    }
};

VirtualClient.prototype.sendTextValue = function(val) {
    if (this.team && val) {
        this.send('tt' + this.team + ',' + val);
    }
};

VirtualClient.prototype.sendText = function() {
    var box = document.getElementById('txt-' + this.index);
    if (this.team && box.value) {
        this.sendTextValue(box.value);
        box.value = '';
    }
};

VirtualClient.prototype.sendGeoAt = function(x, y) {
    if (this.team) {
        x = Math.max(0, Math.min(100, x));
        y = Math.max(0, Math.min(100, y));
        document.getElementById('geo-' + this.index).value = x + ',' + y;
        this.send('ii' + this.team + ',' + x + ',' + y);
    }
};

VirtualClient.prototype.sendGeo = function() {
    if (this.team) {
        var parts = document.getElementById('geo-' + this.index).value.split(',');
        if (parts.length === 2) {
            this.sendGeoAt(parseInt(parts[0].trim()), parseInt(parts[1].trim()));
        }
    }
};

VirtualClient.prototype.sendRandomGeo = function() {
    this.sendGeoAt(Math.floor(Math.random() * 100), Math.floor(Math.random() * 100));
};

VirtualClient.prototype.sendChoiceOf = function(option) {
    if (this.team) {
        option = Math.max(1, Math.min(6, option));
        document.getElementById('choice-' + this.index).value = option;
        this.send('mc' + this.team + ',' + option);
    }
};

VirtualClient.prototype.sendChoice = function() {
    if (this.team) {
        var option = parseInt(document.getElementById('choice-' + this.index).value.trim(), 10);
        if (!isNaN(option)) {
            this.sendChoiceOf(option);
        }
    }
};

VirtualClient.prototype.sendRandomChoice = function() {
    this.sendChoiceOf(1 + Math.floor(Math.random() * this.optionCount));
};

VirtualClient.prototype.sendWaveAt = function(value) {
    if (this.team) {
        value = Math.max(1, Math.min(99, value));
        document.getElementById('wave-' + this.index).value = value;
        this.send('wv' + this.team + ',' + value);
    }
};

VirtualClient.prototype.sendWave = function() {
    if (this.team) {
        var value = parseInt(document.getElementById('wave-' + this.index).value.trim(), 10);
        if (!isNaN(value)) {
            this.sendWaveAt(value);
        }
    }
};

VirtualClient.prototype.sendRandomWave = function() {
    this.sendWaveAt(1 + Math.floor(Math.random() * 99));
};

// One step of a test pattern. Returns a description for the log, or null if the client was
// in no state to do it (no team yet, or the socket is shut), which the runner reports.
VirtualClient.prototype.runAction = function(verb, args) {
    var connected = this.ws && this.ws.readyState === WebSocket.OPEN;

    // 'connect' and 'disconnect' are about the socket, so they are the only ones that are
    // allowed to run without one.
    if (verb === 'connect') {
        if (connected) return 'already connected';
        this.connect();
        return 'connecting';
    }
    if (verb === 'disconnect') {
        if (!this.ws) return 'already disconnected';
        this.disconnect();
        return 'disconnecting';
    }
    if (!connected) return null;

    switch (verb) {
        case 'buzz':
            if (!this.team) return null;
            this.buzz();
            return 'buzz';
        case 'hi':
        case 'lo':
            if (!this.team) return null;
            this.sendHL(verb);
            return verb;
        case 'text':
            if (!this.team) return null;
            this.sendTextValue(args.join(','));
            return 'text';
        case 'geo':
            if (!this.team) return null;
            if (args[0] === 'random') {
                this.sendRandomGeo();
            } else {
                this.sendGeoAt(parseInt(args[0], 10), parseInt(args[1], 10));
            }
            return 'geo';
        case 'choice':
            if (!this.team) return null;
            if (args[0] === 'random') {
                this.sendRandomChoice();
            } else {
                this.sendChoiceOf(parseInt(args[0], 10));
            }
            return 'choice';
        case 'wave':
            if (!this.team) return null;
            if (args[0] === 'random') {
                this.sendRandomWave();
            } else {
                this.sendWaveAt(parseInt(args[0], 10));
            }
            return 'wave';
        case 'wiki': {
            if (!this.team) return null;
            //A wiki action that cannot run says exactly why on the client's own log. The
            //runner's generic complaint ("not connected, or has no team yet") would be
            //wrong here and would send you looking in the wrong place.
            var why = null;
            if (args[0] === 'back') {
                if (this.race) {
                    this.send('wb' + this.team);
                } else {
                    why = 'wiki: no race is running';
                }
            } else if (args[0] === 'stray') {
                why = this.walkStray(parseInt(args[1], 10));
            } else {
                why = this.walkShort(parseInt(args[1], 10));
            }
            if (why) this.log('msg-err', why);
            return 'wiki';
        }
        case 'pick':
            this.pickTeam(args.length ? args[0] : this.index);
            return 'pick';
        case 'ping':
            this.send('pi');
            return 'ping';
        case 'raw':
            // Deliberately unvalidated: the point is to send the server rubbish.
            this.send(args.join(','));
            return 'raw';
    }
    return null;
};

// Global controls
// clients is 1-indexed: clients[1] = VirtualClient with index 1, clients[0] unused
function buildGrid() {
    var count = parseInt(document.getElementById('cfg-count').value);
    // Disconnect and remove existing clients
    for (var i = 1; i < clients.length; i++) {
        if (clients[i]) clients[i].disconnect();
    }
    document.getElementById('grid').innerHTML = '';
    clients = [null]; // placeholder at index 0

    for (var i = 1; i <= count; i++) {
        var vc = new VirtualClient(i);
        clients[i] = vc;
        vc.updateStatus();
    }
    applyShowAnswers();
}

// The hand-typed answer boxes, shown or hidden across the whole grid at once.
function applyShowAnswers() {
    var show = document.getElementById('cfg-showanswers').checked;
    for (var i = 1; i < clients.length; i++) {
        if (!clients[i]) continue;
        var row = document.getElementById('answers-' + i);
        if (row) row.style.display = show ? 'flex' : 'none';
    }
}

function connectAll() {
    buildGrid();
    for (var i = 1; i < clients.length; i++) {
        (function(idx) {
            setTimeout(function() { clients[idx].connect(); }, (idx - 1) * 100);
        })(i);
    }
}

function disconnectAll() {
    for (var i = 1; i < clients.length; i++) {
        if (clients[i]) clients[i].disconnect();
    }
}

// Rebuild grid when count changes
document.getElementById('cfg-count').addEventListener('change', buildGrid);
document.getElementById('cfg-showanswers').addEventListener('change', applyShowAnswers);

// Initial grid
buildGrid();


// ---------------------------------------------------------------- test patterns
// The patterns themselves live in test-patterns.js; see the comment at the top of it for
// the format. Everything below is only the reading and firing of them.

// How many arguments each action takes, and whether the trailing ones are joined back up
// (a text answer or a raw message may contain commas, a coordinate may not).
var ACTIONS = {
    buzz:       { min: 0, max: 0 },
    hi:         { min: 0, max: 0 },
    lo:         { min: 0, max: 0 },
    ping:       { min: 0, max: 0 },
    connect:    { min: 0, max: 0 },
    disconnect: { min: 0, max: 0 },
    pick:       { min: 0, max: 1 },
    text:       { min: 1, max: Infinity },
    raw:        { min: 1, max: Infinity },
    geo:        { min: 1, max: 2 },
    wave:       { min: 1, max: 1 },
    choice:     { min: 1, max: 1 },
    wiki:       { min: 1, max: 2 }
};

// Names that read better in a pattern than the two-letter protocol codes do.
var ACTION_ALIASES = { higher: 'hi', lower: 'lo', 'true': 'hi', 'false': 'lo', answer: 'text' };

var patterns = [];
var patternRun = null; // { pattern, step, timer } while one is firing

// Turns the pattern text into a list of {name, steps, maxClient}. Anything it cannot make
// sense of is reported rather than silently dropped, since a typo in a pattern otherwise
// looks exactly like a bug in the server.
function parsePatterns(text) {
    var result = [], errors = [], current = null;
    var lines = text.split('\n');

    // Errors quote the offending line rather than numbering it: the pattern text is a
    // string inside test-patterns.js, so any line number counted here would be off by
    // however long that file's header comment happens to be.
    function bad(line, why) {
        errors.push((current ? '"' + current.name + '", ' : '') + '"' + line + '": ' + why);
    }

    for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (line === '' || line.charAt(0) === '#') continue;

        if (line.charAt(0) === ':') {
            current = { name: line.slice(1).trim() || ('Pattern ' + (result.length + 1)), steps: [], maxClient: 0 };
            result.push(current);
            continue;
        }
        if (!current) {
            bad(line, 'comes before any :pattern name');
            continue;
        }

        var wait = /^wait\s+([0-9]+)\s*(ms)?$/i.exec(line);
        if (wait) {
            current.steps.push({ text: line, wait: parseInt(wait[1], 10) });
            continue;
        }

        if (/^wait\b/i.test(line)) {
            bad(line, 'should be "wait <milliseconds>"');
            continue;
        }

        var fields = line.split(',');
        if (fields.length < 2) {
            bad(line, 'is not <who>,<action>');
            continue;
        }
        var who = fields[0].trim();
        var verb = fields[1].trim().toLowerCase();
        var args = fields.slice(2);

        verb = ACTION_ALIASES[verb] || verb;
        var spec = ACTIONS[verb];
        if (!spec) {
            bad(line, 'unknown action "' + verb + '"');
            continue;
        }
        if (args.length < spec.min || args.length > spec.max) {
            var wanted = spec.max === Infinity ? 'at least ' + spec.min :
                         spec.min === spec.max ? String(spec.min) : spec.min + '-' + spec.max;
            bad(line, '"' + verb + '" takes ' + wanted + ' arguments, got ' + args.length);
            continue;
        }
        if (spec.max === Infinity) {
            // A text answer or a raw message is put back together with its commas, so only
            // the space after the separating comma is ours to remove: "hello, world" stays
            // "hello, world".
            args[0] = args[0].replace(/^\s+/, '');
        } else {
            args = args.map(function(a) { return a.trim(); });
        }
        if (verb === 'geo' && args[0] !== 'random' &&
            (args.length !== 2 || !/^[0-9]+$/.test(args[0]) || !/^[0-9]+$/.test(args[1]))) {
            bad(line, 'geo takes "random" or two numbers 0-100');
            continue;
        }
        if (verb === 'wave' && args[0] !== 'random' && !/^[0-9]+$/.test(args[0])) {
            bad(line, 'wave takes "random" or one number 1-99');
            continue;
        }
        if (verb === 'choice' && args[0] !== 'random' && !/^[1-6]$/.test(args[0])) {
            bad(line, 'choice takes "random" or one number 1-6');
            continue;
        }
        if (verb === 'wiki') {
            var sub = args[0];
            if (sub !== 'short' && sub !== 'stray' && sub !== 'back') {
                bad(line, 'wiki takes "short", "stray" or "back"');
                continue;
            }
            if (sub === 'back' && args.length !== 1) {
                bad(line, 'wiki back takes no further arguments');
                continue;
            }
            if (sub !== 'back' && !/^[0-9]+$/.test(args[1] || '')) {
                bad(line, 'wiki ' + sub + ' takes one number');
                continue;
            }
        }

        var target = parseTarget(who);
        if (!target) {
            bad(line, '"' + who + '" is not a client number, range or *');
            continue;
        }
        if (target.to > current.maxClient) current.maxClient = target.to;
        current.steps.push({ text: line, target: target, verb: verb, args: args });
    }

    return { patterns: result, errors: errors };
}

// '*' / 'all', a single client, or an inclusive range.
function parseTarget(who) {
    if (who === '*' || who.toLowerCase() === 'all') return { all: true, to: 0 };
    var range = /^([0-9]+)\s*-\s*([0-9]+)$/.exec(who);
    if (range) {
        var from = parseInt(range[1], 10), to = parseInt(range[2], 10);
        if (from < 1 || to < from) return null;
        return { from: from, to: to };
    }
    if (/^[0-9]+$/.test(who)) {
        var n = parseInt(who, 10);
        if (n < 1) return null;
        return { from: n, to: n };
    }
    return null;
}

// The clients a step applies to. Out-of-range numbers are dropped here and reported by the
// runner: a pattern written for eight clients should still do something useful with four.
function targetClients(target) {
    var out = [], i;
    if (target.all) {
        for (i = 1; i < clients.length; i++) if (clients[i]) out.push(clients[i]);
        return out;
    }
    for (i = target.from; i <= target.to; i++) if (clients[i]) out.push(clients[i]);
    return out;
}

function initPatterns() {
    var sel = document.getElementById('cfg-pattern');
    var status = document.getElementById('pattern-status');

    if (typeof window.TEST_PATTERNS !== 'string') {
        sel.innerHTML = '<option>(test-patterns.js not loaded)</option>';
        sel.disabled = true;
        document.getElementById('btn-fire').disabled = true;
        status.className = 'warn';
        status.textContent = 'test-patterns.js did not load — it must sit next to this page.';
        return;
    }

    var parsed = parsePatterns(window.TEST_PATTERNS);
    patterns = parsed.patterns;

    sel.innerHTML = '';
    for (var i = 0; i < patterns.length; i++) {
        var p = patterns[i];
        var opt = document.createElement('option');
        opt.value = i;
        opt.textContent = p.name + '  (' + p.steps.length + ' steps' +
                          (p.maxClient > 1 ? ', needs ' + p.maxClient + ' clients' : '') + ')';
        sel.appendChild(opt);
    }

    if (parsed.errors.length) {
        status.className = 'warn';
        status.textContent = parsed.errors.length + ' bad line(s) in test-patterns.js — see the log';
        for (var e = 0; e < parsed.errors.length; e++) patternLog('msg-err', parsed.errors[e]);
    }
    if (!patterns.length) {
        sel.innerHTML = '<option>(no patterns defined)</option>';
        sel.disabled = true;
        document.getElementById('btn-fire').disabled = true;
    }
}

function setPatternRunning(running) {
    document.getElementById('btn-fire').disabled = running;
    document.getElementById('btn-stop').disabled = !running;
    document.getElementById('cfg-pattern').disabled = running;
}

function firePattern() {
    if (patternRun) return;
    var p = patterns[parseInt(document.getElementById('cfg-pattern').value, 10)];
    if (!p) return;

    var status = document.getElementById('pattern-status');
    status.className = '';
    status.textContent = 'running "' + p.name + '"...';
    patternLog('msg-pattern', 'fire "' + p.name + '" (' + p.steps.length + ' steps)');

    patternRun = { pattern: p, step: 0, timer: null };
    stepPattern();
}

function stopPattern() {
    if (!patternRun) return;
    if (patternRun.timer) clearTimeout(patternRun.timer);
    patternLog('msg-pattern', 'stopped "' + patternRun.pattern.name + '" at step ' + (patternRun.step + 1));
    document.getElementById('pattern-status').textContent = 'stopped';
    patternRun = null;
    setPatternRunning(false);
}

// Runs steps until it hits a wait, so that consecutive lines really do go out together.
function stepPattern() {
    setPatternRunning(true);
    var run = patternRun;

    while (run.step < run.pattern.steps.length) {
        var step = run.pattern.steps[run.step++];

        if (step.wait != null) {
            run.timer = setTimeout(function() {
                if (patternRun === run) { run.timer = null; stepPattern(); }
            }, step.wait);
            return;
        }

        var targets = targetClients(step.target);
        if (!targets.length) {
            patternLog('msg-err', '"' + step.text + '": no such client on the grid');
            continue;
        }
        for (var i = 0; i < targets.length; i++) {
            if (targets[i].runAction(step.verb, step.args) === null) {
                patternLog('msg-err', '"' + step.text + '": client ' + targets[i].index +
                                      ' cannot do that — not connected, or has no team yet');
            }
        }
    }

    patternLog('msg-pattern', 'finished "' + run.pattern.name + '"');
    document.getElementById('pattern-status').textContent = 'finished "' + run.pattern.name + '"';
    patternRun = null;
    setPatternRunning(false);
}

initPatterns();
loadWikiCorpus();
</script>
